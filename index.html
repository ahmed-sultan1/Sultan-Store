<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan Store</title>

<style>

/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Poppins', Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

/* ===== OVERLAY ===== */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
  display:none;
  z-index:999;
}

/* ===== NAVBAR ===== */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.cart-btn{
  background:#0f172a;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== HERO ===== */
.hero{
  height:300px;
  background:linear-gradient(to right,#0f172a,#1e293b);
  display:flex;
  align-items:center;
  padding:40px;
  color:white;
}

.hero h1{
  font-size:48px;
}

/* ===== SEARCH ===== */
.search{
  display:flex;
  justify-content:center;
  margin:20px;
}

.search input{
  padding:10px;
  width:50%;
  border-radius:8px;
  border:1px solid #ddd;
}

/* ===== FILTERS ===== */
.filters{
  text-align:center;
  margin:20px;
}

.filters button{
  margin:5px;
  padding:8px 15px;
  border:none;
  background:#eee;
  border-radius:20px;
  cursor:pointer;
}

/* ===== PRODUCTS ===== */
.products{
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}

.buy{
  width:100%;
  padding:10px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* ===== CART ===== */
.cart{
  position: fixed;
  right: -100%;
  top: 0;
  width: 350px;
  height: 100%;
  background: #fff;
  padding: 20px;
  transition: 0.4s;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: -5px 0 15px rgba(0,0,0,0.1);
}

.cart.open {
  right: 0;
}

/* ===== PAYMENT ===== */
.payment-methods {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 15px 0;
}

.pay-btn {
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.instapay {
  background: #f5f5f5;
  border: 1px solid #ddd;
}

.vodafone {
  background: #e60000;
  color: white;
}

/* ===== CHECKOUT ===== */
.checkoutBox input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ddd;
}

.send-order-btn{
  width:100%;
  padding:10px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* ===== WELCOME ===== */
#welcome{
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#f5f5f5;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
}

#welcome button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  background:#0f172a;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" onclick="closeCart()"></div>

<!-- WELCOME -->
<div id="welcome">
  <h1>Welcome to Sultan Store</h1>
  <p>Premium men's fashion</p>
  <button onclick="enterStore()">Enter Store</button>
</div>

<nav>
<div class="logo">SULTAN</div>
<button class="cart-btn" onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
</nav>

<div class="hero">
  <div>
    <h1>New Collection</h1>
  </div>
</div>

<div class="search">
<input id="search" oninput="searchProducts()" placeholder="Search products...">
</div>

<div class="filters">
<button onclick="filter('all')">All</button>
<button onclick="filter('hoodie')">Hoodies</button>
<button onclick="filter('tshirt')">T-Shirts</button>
</div>

<div class="products" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
    <h2>Cart</h2>
    <div id="cartItems"></div>
    <div id="total">Total: 0 EGP</div>

    <div class="payment-methods">
      <button class="pay-btn instapay"
        onclick="window.open('https://ipn.eg/S/ahmedsultan3523/instapay/9QjNRe')">
        💳 Pay via InstaPay
      </button>

      <button class="pay-btn vodafone"
        onclick="copyNumber('01096380149')">
        📱 Vodafone Cash: 01096380149
      </button>
    </div>

    <div class="checkoutBox">
        <input id="name" placeholder="Full Name">
        <input id="address" placeholder="Address">
        <input id="phone" placeholder="Phone">
        <button class="send-order-btn" onclick="sendOrder()">Send Order via WhatsApp</button>
    </div>
</div>

<script>

/* ===== DATA ===== */
let productsData = [
  {name:"Classic Blue Polo",price:299,image:"Images/Shirt4.webp",category:"tshirt"},
  {name:"Burgundy Hoodie",price:450,image:"Images/hoodie1.webp",category:"hoodie"},
  {name:"Street T-Shirt",price:300,image:"Images/t-shirt.jpg",category:"tshirt"},
  {name:"T-Shirt",price:250,image:"Images/download.webp",category:"tshirt"},
  {name:"Shirt",price:400,image:"Images/download (1).webp",category:"Shirt"},
];

let cart = [];

/* ===== RENDER ===== */
function render(data=productsData){
let box=document.getElementById("products");box.innerHTML="";
data.forEach((p,i)=>{
box.innerHTML+=`
<div class='card'>
<img src='${p.image}'>
<h3>${p.name}</h3>
<p>${p.price} EGP</p>
<button class='buy' onclick="add(${i})">Add to Cart</button>
</div>`})
}

/* ===== CART ===== */
function add(i){cart.push(productsData[i]);update()}

function update(){
let box=document.getElementById("cartItems");box.innerHTML="";
let t=0;

cart.forEach((c,i)=>{
t+=c.price;
box.innerHTML+=`
<div style="display:flex;justify-content:space-between">
<span>${c.name}</span>
<button onclick="removeItem(${i})">X</button>
</div>`
})

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText="Total: "+t+" EGP";
}

function removeItem(i){
cart.splice(i,1);
update();
}

/* ===== FILTER ===== */
function filter(t){
if(t=='all')render();
else render(productsData.filter(p=>p.category==t))
}

/* ===== SEARCH ===== */
function searchProducts(){
let v=document.getElementById("search").value.toLowerCase();
render(productsData.filter(p=>p.name.toLowerCase().includes(v)))
}

/* ===== CART CONTROL (AI TOUCH) ===== */
function toggleCart(){
let cartEl = document.getElementById("cart");
let overlay = document.getElementById("overlay");

cartEl.classList.toggle("open");

if(cartEl.classList.contains("open")){
  overlay.style.display="block";
}else{
  overlay.style.display="none";
}
}

function closeCart(){
document.getElementById("cart").classList.remove("open");
document.getElementById("overlay").style.display="none";
}

/* ===== SWIPE TO CLOSE ===== */
let startX = 0;
const cartEl = document.getElementById("cart");

cartEl.addEventListener("touchstart", function(e){
startX = e.touches[0].clientX;
});

cartEl.addEventListener("touchmove", function(e){
let moveX = e.touches[0].clientX;
if(startX - moveX > 80){
  closeCart();
}
});

/* ===== COPY ===== */
function copyNumber(num){
navigator.clipboard.writeText(num);
alert("Number copied 👍");
}

/* ===== WHATSAPP ORDER ===== */
function sendOrder(){
let msg="New Order%0A%0A";

msg+="Name: "+document.getElementById("name").value+"%0A";
msg+="Address: "+document.getElementById("address").value+"%0A";
msg+="Phone: "+document.getElementById("phone").value+"%0A%0A";

msg+="Products:%0A";

let total=0;

cart.forEach((c,i)=>{
total+=c.price;
msg+=(i+1)+"- "+c.name+" ("+c.price+" EGP)%0A";
});

msg+="%0ATotal: "+total+" EGP";

window.open("https://wa.me/201096380149?text="+msg);
}

/* ===== WELCOME ===== */
function enterStore(){
document.getElementById("welcome").style.display="none";
}

render();

</script>

</body>
</html>
