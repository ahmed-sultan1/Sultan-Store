<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
}

.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

input{
  padding:10px;
  margin:5px;
  width:250px;
}

button{
  padding:10px;
  border:none;
  background:#0f172a;
  color:#fff;
  cursor:pointer;
  border-radius:6px;
}

.dashboard{
  display:none;
  padding:20px;
}

.cards{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.card{
  flex:1;
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
  width:100%;
  background:#fff;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}

th{
  background:#0f172a;
  color:#fff;
}

.del{
  background:red;
  padding:5px 8px;
  border:none;
  color:#fff;
  cursor:pointer;
  border-radius:5px;
}

.status{
  padding:5px;
  border-radius:5px;
  border:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Admin Login</h2>
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">

<h2>📦 Orders Dashboard</h2>

<div class="cards">
  <div class="card">💰 Sales: <span id="sales">0</span> EGP</div>
  <div class="card">📦 Orders: <span id="ordersCount">0</span></div>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Address</th>
<th>Items</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="orders"></tbody>
</table>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyjnyhtcQk6VRu-Rjl6oeJuQpAoJC-ExtCQUyBC32aBvbEa8KpJoWjKbLI8ca2mRTbPBw/exec";
const PASSWORD = "Aa252026!@#";

let ordersData = [];

function login(){
  let p = document.getElementById("pass").value;
  if(p === PASSWORD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("dash").style.display="block";
    loadOrders();
  } else {
    alert("Wrong password");
  }
}

async function loadOrders(){

  let res = await fetch(API_URL);
  let data = await res.json();

  ordersData = data.slice(1);

  render();

}

function render(){

  let table = document.getElementById("orders");
  table.innerHTML = "";

  let totalSales = 0;

  ordersData.forEach((row,i)=>{

    let status = row[6] || "Pending";

    totalSales += Number(row[5]);

    table.innerHTML += `
      <tr>
        <td>${row[1]}</td>
        <td>${row[2]}</td>
        <td>${row[3]}</td>
        <td><pre>${row[4]}</pre></td>
        <td>${row[5]}</td>

        <td>
          <select class="status" onchange="changeStatus(${i},this.value)">
            <option ${status==="Pending"?"selected":""}>Pending</option>
            <option ${status==="Delivered"?"selected":""}>Delivered</option>
          </select>
        </td>

        <td>
          <button class="del" onclick="deleteOrder(${i})">X</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("sales").innerText = totalSales;
  document.getElementById("ordersCount").innerText = ordersData.length;
}

function changeStatus(i,val){
  ordersData[i][6] = val;
  save();
}

function deleteOrder(i){
  ordersData.splice(i,1);
  save();
}

function save(){
  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      type:"update",
      data:ordersData
    })
  });

  render();
}

// auto refresh
setInterval(()=> {
  if(document.getElementById("dash").style.display==="block"){
    loadOrders();
  }
},5000);

</script>

</body>
</html>
