<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sultan Store</title>

<style>

/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: 'Poppins', Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

/* ===== NAVBAR ===== */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.cart-btn{
  background:#0f172a;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== HERO ===== */
.hero{
  height:300px;
  background:linear-gradient(to right,#0f172a,#1e293b);
  display:flex;
  align-items:center;
  padding:40px;
  color:white;
}

.hero h1{
  font-size:48px;
}

/* ===== SEARCH ===== */
.search{
  display:flex;
  justify-content:center;
  margin:20px;
}

.search input{
  padding:10px;
  width:50%;
  border-radius:8px;
  border:1px solid #ddd;
}

/* ===== FILTERS ===== */
.filters{
  text-align:center;
  margin:20px;
}

.filters button{
  margin:5px;
  padding:8px 15px;
  border:none;
  background:#eeeeee;
  border-radius:20px;
  cursor:pointer;
}

/* ===== PRODUCTS ===== */
.products{
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}

.buy{
  width:100%;
  padding:10px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* ===== CART ===== */
.cart{
  position: fixed;
  right: -100%;
  top: 0;
  width: 350px;
  height: 100%;
  background: #fff;
  padding: 20px;
  transition: 0.4s;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: -5px 0 15px rgba(0,0,0,0.1);
}

.cart.open {
  right: 0;
}

/* ===== PAYMENT ===== */
.payment-methods {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 15px 0;
}

.pay-btn {
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.instapay {
  background: linear-gradient(135deg,#2E7CF6,#7A5CFA);
  color: white;
  border: none;
}


.vodafone {
  background: #e60000;
  color: white;
}

/* ===== CHECKOUT ===== */
.checkoutBox input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #ddd;
}

.send-order-btn{
  width:100%;
  padding:10px;
  background:#0f172a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* ===== WELCOME ===== */
#welcome{
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#f5f5f5;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;

  animation: fadeZoom 0.8s ease;
}

/* ✨ animation دخول */
@keyframes fadeZoom{
  from{
    opacity:0;
    transform:scale(1.1);
    filter:blur(10px);
  }
  to{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

/* ✨ حركة خفيفة للنص */
#welcome h1{
  font-size:40px;
  animation: floatText 3s ease-in-out infinite;
}

@keyframes floatText{
  0%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
  100%{transform:translateY(0)}
}

#welcome p{
  color:#666;
}

#welcome button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  background:#0f172a;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

#welcome button:hover{
  transform:scale(1.1);
}
/* ===== HERO ===== */
.hero {
  height: 150px; /* تم تقليل الارتفاع من 300px إلى 150px */
  background: linear-gradient(to right, #0f172a, #1e293b);
  display: flex;
  align-items: center;
  padding: 40px;
  color: white;
}
.footer{
  background:#0f172a;
  color:white;
  margin-top:50px;
  padding:40px 20px 10px;
}

.footer-container{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:20px;
}

.footer-box{
  min-width:200px;
}

.footer-box h3, .footer-box h2{
  margin-bottom:10px;
}

.footer-box a{
  display:block;
  color:#bbb;
  text-decoration:none;
  margin:5px 0;
}

.footer-box a:hover{
  color:white;
}

.footer-bottom{
  text-align:center;
  margin-top:20px;
  padding-top:10px;
  border-top:1px solid #222;
  font-size:13px;
  color:#aaa;
}

</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome">
  <h1>Welcome to Sultan Store</h1>
  <p>Premium men's fashion</p>
  <button onclick="enterStore()">Enter Store</button>
</div>

<nav>
<div class="logo">SULTAN</div>
<button class="cart-btn" onclick="toggleCart()">🛒 (<span id="count">0</span>)</button>
</nav>

<div class="hero">
  <div>
    <h1>New Collection</h1>
  </div>
</div>

<div class="search">
<input id="search" oninput="searchProducts()" placeholder="Search products...">
</div>

<div class="filters">
<button onclick="filter('all')">All</button>
<button onclick="filter('hoodie')">Hoodies</button>
<button onclick="filter('tshirt')">T-Shirts</button>
</div>

<div class="products" id="products"></div>

<!-- CART -->
<div class="cart" id="cart">
    <h2>Cart</h2>
    
    <div id="cartItems"></div>
    <button onclick="toggleCart()" 
style="position:absolute;top:10px;right:10px;
background:rgb(24, 23, 23);color:#fff;border:none;
width:30px;height:30px;border-radius:50%;
cursor:pointer;">
X
</button>
    <div id="total">Total: 0 EGP</div>

    <div class="payment-methods">
      <button class="pay-btn instapay"
        onclick="window.open('https://ipn.eg/S/ahmedsultan3523/instapay/9QjNRe')">
        💳 Pay via InstaPay
      </button>

      <button class="pay-btn vodafone"
        onclick="copyNumber('01096380149')">
        📱 Vodafone Cash: 01096380149
      </button>
    </div>

    <div class="checkoutBox">
        <input id="name" placeholder="Full Name">
        <input id="address" placeholder="Address">
        <input id="phone" placeholder="Phone">
        <button class="send-order-btn" onclick="sendOrder()">Send Order </button>
    </div>
</div>

<script>

/* ===== DATA ===== */
let productsData = [
  {name:"Classic Blue Polo",price:299,image:"Images/Shirt4.webp",category:"tshirt"},
  {name:"Burgundy Hoodie",price:450,image:"Images/hoodie1.webp",category:"hoodie"},
  {name:"Street T-Shirt",price:300,image:"Images/t-shirt.jpg",category:"tshirt"},
  {name:"T-Shirt",price:250,image:"Images/download.webp",category:"tshirt"},
  {name:"Shirt",price:400,image:"Images/download (1).webp",category:"Shirt"},
];

let cart = [];

/* ===== RENDER ===== */
function render(data=productsData){
let box=document.getElementById("products");box.innerHTML="";
data.forEach((p,i)=>{
box.innerHTML+=`
<div class='card'>
<img src='${p.image}'>
<h3>${p.name}</h3>
<p>${p.price} EGP</p>
<button class='buy' onclick="add(${i})">Add to Cart</button>
</div>`})
}

/* ===== CART ===== */
function add(i){cart.push(productsData[i]);update()}

function update(){
let box=document.getElementById("cartItems");box.innerHTML="";
let t=0;

cart.forEach((c,i)=>{
t+=c.price;
box.innerHTML+=`
<div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">
<span>${c.name}</span>
<button onclick="event.stopPropagation(); removeItem(${i})"
style="background:red;color:#fff;border:none;width:25px;height:25px;border-radius:6px;cursor:pointer;">
X
</button>
</div>`
})

document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText="Total: "+t+" EGP";
}

function removeItem(i){
cart.splice(i,1);
update();
}

/* ===== FILTER ===== */
function filter(t){
if(t=='all')render();
else render(productsData.filter(p=>p.category==t))
}

/* ===== SEARCH ===== */
function searchProducts(){
let v=document.getElementById("search").value.toLowerCase();
render(productsData.filter(p=>p.name.toLowerCase().includes(v)))
}

/* ===== CART TOGGLE ===== */
function toggleCart(){
document.getElementById("cart").classList.toggle("open")
}

/* ===== COPY NUMBER ===== */
function copyNumber(num){
navigator.clipboard.writeText(num);
alert("Number copied 👍");
}

/* ===== Send order ===== */
function sendOrder(){

  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

let now = new Date();
let orderId = "ORD-" + Date.now().toString().slice(-6);

let orderData = {
  orderId: orderId,
  name: document.getElementById("name").value,
  address: document.getElementById("address").value,
  phone: document.getElementById("phone").value,
  items: cart,
  total: cart.reduce((sum, item) => sum + Number(item.price), 0),
  date: now.toLocaleDateString(),
  time: now.toLocaleTimeString()
};

fetch("https://script.google.com/macros/s/AKfycbxVKBufiE83BrHVAT0FaFTry4z91Qx3XXhSSXfYT1JQuwV6_XeU0yeLWZa1MgGOar7emQ/exec", {
  method: "POST",
  body: JSON.stringify(orderData)
});


  // ✅ Confirm message أول حاجة
  let msg = document.createElement("div");

msg.innerHTML = "✅ Order Confirmed Successfully!";
msg.style.cssText = `
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#0f172a;
color:#fff;
padding:15px 25px;
border-radius:10px;
z-index:99999;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
font-weight:bold;
`;

document.body.appendChild(msg);

setTimeout(()=> {
  msg.remove();
}, 2500);

  // 🔊 تشغيل الصوت بشكل مضمون
  const sound = document.getElementById("successSound");
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }

  // 📄 PDF بعد تأخير بسيط (ده سر الحل)
  setTimeout(() => {
    generatePDF(orderData);
  }, 300);

  

  cart = [];
  update();
}



/* ===== WELCOME ===== */
function enterStore(){
  document.getElementById("welcome").style.display="none";
}

/* ===== AI CLOSE CART ===== */
window.addEventListener('click', function(e) {
  const cart = document.getElementById('cart');
  const cartBtn = document.querySelector('.cart-btn');

  if (cart.contains(e.target)) return;
  if (cartBtn.contains(e.target)) return;

  cart.classList.remove('open');
});

render();
function generatePDF(order){

const itemsRows = order.items.map(item => `
<tr>
  <td style="border:1px solid #ddd;padding:8px;">
    ${item.name}
  </td>

  <td style="border:1px solid #ddd;padding:8px;">
    ${item.category}
  </td>

  <td style="<td style="border:1px solid #ddd;padding:8px;">
    ${item.price} EGP
  </td>
</tr>
`).join("");

  const orderId = Date.now();

const qrText = `https://sultan-store.vercel.app/order.html?id=${order.orderId}`;

  const wrapper = document.createElement("div");

  wrapper.innerHTML = `
    <div id="invoice" style="
      font-family:Arial;
      padding:20px;
      width:800px;
      background:#fff;
      color:#111;
      box-sizing:border-box;
    ">

      <h1 style="text-align:center;color:#0f172a">SULTAN STORE</h1>
      <p style="text-align:center">Invoice</p>

      <hr/>

      <p><b>Name:</b> ${order.name}</p>
      <p><b>Phone:</b> ${order.phone}</p>
      <p><b>Address:</b> ${order.address}</p>
       <p><b>Date:</b> ${order.date}</p>
      <p><b>Time:</b> ${order.time}</p>

<table style="
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  table-layout:fixed;
  font-size:13px;
  border:1px solid #ddd;
">

  <thead>
    <tr style="background:#0f172a;color:#fff">
      <th style="padding:10px;width:50%;text-align:left;">Product</th>
      <th style="width:25%;text-align:left;">Category</th>
      <th style="width:25%;text-align:left;">Price</th>
    </tr>
  </thead>

  <tbody>
    ${itemsRows}
  </tbody>

     </table>

    <div style="width:100%;display:flex;justify-content:flex-end;margin-top:25px;">
  <h2 style="margin:0;padding-right:10px;">
    Total: ${order.total} EGP
  </h2>
</div>

      <div style="
        text-align:center;
        margin-top:30px;
        padding:20px;
        border:1px solid #eee;
        width:100%;
        box-sizing:border-box;
      ">

        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=10&data=${encodeURIComponent(qrText)}"
          style="
            width:200px;
            height:200px;
            display:block;
            margin:0 auto;
            object-fit:contain;
          "
        >

        <p style="font-size:12px;color:#666;margin-top:10px">
          Scan to verify order
        </p>

      </div>

    </div>
  `;

  document.body.appendChild(wrapper);

  const invoice = document.getElementById("invoice");

  html2pdf()
    .set({
      margin: 10,
      filename: `invoice-${order.name}-${orderId}.pdf`,
      html2canvas: {
        scale: 1.8,
        useCORS: true,
        scrollY: 0
      },
      jsPDF: {
        unit: "mm",
        format: "a4",
        orientation: "portrait"
      }
    })
    .from(invoice)
    .save()
    .then(() => {
      document.body.removeChild(wrapper);
    });

}



function openModal(type){

  let content = "";

  if(type === "about"){
    content = `
      <h2>About Us</h2>
      <p>Sultan Store is a premium men's fashion brand offering modern and stylish clothing with high quality.</p>
    `;
  }

  if(type === "contact"){
    content = `
      <h2>Contact Us</h2>
      <p>Phone: 01096380149</p>
      <p>Email: support@sultanstore.com</p>
    `;
  }

  if(type === "shipping"){
    content = `
      <h2>Shipping Info</h2>
      <p>We deliver all over Egypt within 2-5 days.</p>
      <p>Cash on delivery available.</p>
    `;
  }

  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}



</script>
<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="footer-container">

    <div class="footer-box">
      <h2>SULTAN</h2>
      <p>Premium men's fashion for the modern gentleman</p>
    </div>

    <div class="footer-box">
      <h3>Quick Links</h3>
      <a href="#" onclick="openModal('about')">About Us</a>
<a href="#" onclick="openModal('contact')">Contact</a>
<a href="#" onclick="openModal('shipping')">Shipping Info</a>
    </div>

    <div class="footer-box">
      <h3>Customer Service</h3>
      <a href="#">Returns</a>
      <a href="#">Size Guide</a>
      <a href="#">FAQ</a>
    </div>

  </div>

  <div class="footer-bottom">
    © 2026 SULTAN. All rights reserved.
  </div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<audio id="successSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a0b7c7.mp3?filename=success-1-6297.mp3" type="audio/mp3">
</audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<div id="modal" style="
display:none;
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
z-index:9999;
">

  <div style="
    background:#fff;
    padding:20px;
    width:350px;
    border-radius:10px;
    position:relative;
  ">

    <button onclick="closeModal()" style="
      position:absolute;
      top:10px;right:10px;
      background:red;
      color:#fff;
      border:none;
      width:25px;height:25px;
      border-radius:50%;
      cursor:pointer;
    ">X</button>

    <div id="modalContent"></div>

  </div>
</div>
</body>
</html>
