<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Order Details</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:600px;
  margin:auto;
}

img{
  width:100px;
  border-radius:10px;
  margin:5px;
}
</style>
</head>

<body>

<div class="card">
  <h2>📦 Order Details</h2>

  <p><b>Order ID:</b> <span id="id"></span></p>
  <p><b>Name:</b> <span id="name"></span></p>
  <p><b>Phone:</b> <span id="phone"></span></p>
  <p><b>Total:</b> <span id="total"></span> EGP</p>

  <h3>Items:</h3>
  <div id="items"></div>

</div>

<script>

const API = "https://script.google.com/macros/s/YOUR_SCRIPT_URL/exec";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch(API)
.then(res => res.json())
.then(data => {

  let order = data.find(o => o[1] == id);

  if(!order){
    document.body.innerHTML = "Order not found ❌";
    return;
  }

  document.getElementById("id").innerText = order[1];
  document.getElementById("name").innerText = order[2];
  document.getElementById("phone").innerText = order[3];
  document.getElementById("total").innerText = order[6];

  let itemsBox = document.getElementById("items");

  let items = order[5];

  try{
    items = JSON.parse(items);
  }catch{}

  items.forEach(i=>{
    itemsBox.innerHTML += `
      <div>
        <p>${i.name} - ${i.price} EGP</p>
        <img src="${i.image}">
      </div>
    `;
  });

});

</script>

</body>
</html>
